<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Os Meus Gastos</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#667085;--ac:#1f6feb;--g:#12a150;--rd:#d92d20;--bd:#e3e6ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2029;--tx:#eef1f5;--mu:#9aa5b4;--ac:#5b9bff;--g:#3ccf7e;--rd:#ff6b5e;--bd:#2a323d}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2029;--tx:#eef1f5;--mu:#9aa5b4;--ac:#5b9bff;--g:#3ccf7e;--rd:#ff6b5e;--bd:#2a323d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:16px 16px 150px}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;font-size:16px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:18px;text-transform:capitalize}
.mnav button{width:42px;height:42px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div,.kv3 div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kv div{background:var(--bg);border:0}
.kv small,.kv3 small{display:block;color:var(--mu);font-size:12px}.kv b,.kv3 b{font-size:15px}
.r{color:var(--g)}.d{color:var(--rd)}
.dh{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin:14px 4px 6px;text-transform:capitalize}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer}
.ic{font-size:22px}.it .tx{flex:1;min-width:0}.it small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mu);text-align:center;padding:28px 0}
.cb{margin-bottom:14px}.ch{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.ch small{color:var(--mu);font-weight:400}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}.bar span{display:block;height:100%}
.bd{font-size:12px;color:var(--mu);margin-top:4px}.bd.over{color:var(--rd)}
svg{width:100%;height:auto;display:block}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.dg{background:transparent;color:var(--rd);border:1px solid var(--rd)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.seg button{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.cr span{flex:1}.cr input{width:110px;padding:7px}.cr button{border:0;background:none;color:var(--rd);font-size:16px;padding:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:10}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:600}
.stat{font-size:12px;color:var(--mu);text-align:center;margin-top:8px;min-height:16px}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="mnav" id="mnav"><button id="pv" aria-label="Mês anterior">‹</button><b id="mlab"></b><button id="nx" aria-label="Mês seguinte">›</button></div>

<section id="t-mov">
<div class="kv3"><div><small>Receitas</small><b class="r" id="sr"></b></div><div><small>Despesas</small><b class="d" id="sd"></b></div><div><small>Saldo</small><b id="ss"></b></div></div>
<select id="fc"></select>
<div id="lst"></div>
</section>

<section id="t-res" class="hide"><div id="res"></div></section>

<section id="t-set" class="hide">
<h1>Definições</h1>
<div class="card">
<label for="cur">Moeda</label>
<select id="cur"><option value="EUR">Euro (€)</option><option value="USD">Dólar (US$)</option><option value="GBP">Libra (£)</option><option value="BRL">Real (R$)</option><option value="CHF">Franco suíço (CHF)</option></select>
<label for="th">Tema</label>
<select id="th"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select>
</div>
<div class="card"><h2>Categorias e orçamentos</h2>
<div id="cl"></div>
<label>Nova categoria</label>
<div class="row"><input id="ni" placeholder="Emoji" maxlength="4"><select id="nt2"><option value="d">Despesa</option><option value="r">Receita</option></select></div>
<input id="nn" placeholder="Nome" style="margin-top:8px">
<button class="btn s" id="nadd">Adicionar categoria</button>
</div>
<div class="card" id="exc"><h2>Exportar</h2>
<button class="btn s" id="e1">Exportar este mês (CSV)</button>
<button class="btn s" id="e2">Exportar tudo (CSV)</button>
<div class="stat" id="stat"></div></div>
<div class="card"><h2>Dados</h2>
<p style="font-size:13px;color:var(--mu);margin:0 0 6px">Os movimentos ficam guardados apenas neste dispositivo. Exporte de vez em quando para ter uma cópia de segurança.</p>
<button class="btn dg" id="clr">Apagar todos os movimentos</button></div>
</section>
</main>

<button class="fab" id="fab" aria-label="Novo movimento">+</button>
<nav>
<button id="n-mov" class="on"><span>🧾</span>Movimentos</button>
<button id="n-res"><span>📊</span>Resumo</button>
<button id="n-set"><span>⚙️</span>Definições</button>
</nav>

<div class="ov hide" id="sh"><div class="sheet">
<h2 id="sht">Novo movimento</h2>
<div class="seg"><button id="tpd" class="on">Despesa</button><button id="tpr">Receita</button></div>
<label for="v">Valor</label><input id="v" type="text" inputmode="decimal" placeholder="0,00">
<label for="ct">Categoria</label><select id="ct"></select>
<div class="row"><div><label for="dt">Data</label><input id="dt" type="date"></div><div><label for="nt">Nota</label><input id="nt" placeholder="Opcional"></div></div>
<button class="btn" id="sv">Guardar</button>
<button class="btn dg hide" id="del">Apagar movimento</button>
<button class="btn s" id="cx">Cancelar</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DC=[['sup','🛒','Supermercado'],['cas','🏠','Casa e renda'],['con','💡','Contas (luz, água, net)'],['tra','🚗','Transportes e combustível'],['res','🍽️','Restaurantes e cafés'],['sau','🏥','Saúde'],['laz','🎬','Lazer'],['com','👕','Compras'],['edu','🎓','Educação'],['neg','🔧','Negócio'],['out','📦','Outros']].map(a=>({id:a[0],i:a[1],n:a[2],t:'d',b:0})).concat([{id:'sal',i:'💰',n:'Salário',t:'r',b:0},{id:'orc',i:'➕',n:'Outras receitas',t:'r',b:0}]);
const PAL=['#1f6feb','#f0a63a','#12a150','#d92d20','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b','#14b8a6'];
let D={movs:[],cats:DC},S={cur:'EUR',th:'auto'},mon=today().slice(0,7),tab='mov',ed=null,tp='d',fc='',DL=null,armed=null;
try{const x=JSON.parse(localStorage.getItem('gm_data')||'null');if(x&&x.movs)D={movs:x.movs,cats:x.cats&&x.cats.length?x.cats:DC}}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem('gm_set')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('gm_data',JSON.stringify(D));localStorage.setItem('gm_set',JSON.stringify(S))}catch(e){}};
const fmt=n=>n.toLocaleString('pt-PT',{style:'currency',currency:S.cur});
const pct=n=>n.toLocaleString('pt-PT',{maximumFractionDigits:0})+'%';
const cat=id=>D.cats.find(c=>c.id===id)||{i:'❔',n:'Sem categoria',t:'d',b:0};
const sum=L=>L.reduce((a,x)=>a+x.v,0);
const mkey=(y,m)=>{const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function arm(b,fn){if(armed===b){armed=null;fn();return}armed=b;const o=b.textContent;b.textContent='Toque outra vez para confirmar';setTimeout(()=>{if(armed===b){armed=null;b.textContent=o}},3000)}
function applyTheme(){const r=document.documentElement;S.th==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.th)}

function renderMov(){
  const M=D.movs.filter(x=>x.date.startsWith(mon));
  const r=sum(M.filter(x=>x.t==='r')),d=sum(M.filter(x=>x.t==='d'));
  $('sr').textContent=fmt(r);$('sd').textContent=fmt(d);$('ss').textContent=fmt(r-d);$('ss').className=r-d>=0?'r':'d';
  const opts='<option value="">Todas as categorias</option>'+D.cats.map(c=>`<option value="${c.id}">${c.i} ${esc(c.n)}</option>`).join('');
  $('fc').innerHTML=opts;$('fc').value=fc;
  const L=M.filter(x=>!fc||x.cat===fc).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if(!L.length){$('lst').innerHTML='<div class="empty">Sem movimentos neste mês.<br>Toque em + para adicionar.</div>';return}
  let h='',last='';
  L.forEach(x=>{
    if(x.date!==last){last=x.date;const[y,m,dd]=x.date.split('-').map(Number),gd=sum(L.filter(z=>z.date===x.date&&z.t==='d'));
      h+=`<div class="dh"><span>${new Date(y,m-1,dd).toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'})}</span><span>${gd>0?'Gastou '+fmt(gd):''}</span></div>`}
    const c=cat(x.cat);
    h+=`<div class="it" data-id="${x.id}"><span class="ic">${c.i}</span><div class="tx"><b>${esc(c.n)}</b><small>${esc(x.note||'')}</small></div><b class="${x.t}">${x.t==='d'?'−':'+'}${fmt(x.v)}</b></div>`});
  $('lst').innerHTML=h;
}

function renderRes(){
  const ds=D.movs.filter(x=>x.t==='d'&&x.date.startsWith(mon)),tot=sum(ds);
  const by={};ds.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.v);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let h='<div class="card"><h2>Para onde vai o dinheiro</h2>';
  if(!rows.length)h+='<div class="empty">Sem despesas neste mês.</div>';
  rows.forEach(([id,v],k)=>{const c=cat(id),p=v/tot*100;
    const bud=c.b>0?`<div class="bd ${v>c.b?'over':''}">Orçamento ${fmt(c.b)} · ${pct(v/c.b*100)} usado${v>c.b?' · excedido em '+fmt(v-c.b):''}</div>`:'';
    h+=`<div class="cb"><div class="ch"><span>${c.i} ${esc(c.n)}</span><b>${fmt(v)} <small>${pct(p)}</small></b></div><div class="bar"><span style="width:${p}%;background:${PAL[k%PAL.length]}"></span></div>${bud}</div>`});
  h+='</div>';
  const[y,m]=mon.split('-').map(Number),nd=new Date(y,m,0).getDate(),day=Array(nd).fill(0);
  ds.forEach(x=>day[+x.date.slice(8,10)-1]+=x.v);
  const mx=Math.max(...day,1),bw=620/nd;let svg='<svg viewBox="0 0 620 150">';
  day.forEach((v,i)=>{const hh=v/mx*110;svg+=`<rect x="${i*bw+1}" y="${120-hh}" width="${Math.max(bw-2,1)}" height="${hh}" rx="2" fill="var(--ac)"/>`;if(i===0||(i+1)%5===0)svg+=`<text x="${i*bw+bw/2}" y="140" text-anchor="middle" font-size="11" fill="var(--mu)">${i+1}</text>`});
  h+=`<div class="card"><h2>Gastos dia a dia</h2>${svg}</svg></div>`;
  const now=today(),el=mon===now.slice(0,7)?+now.slice(8,10):nd,ptot=sum(D.movs.filter(x=>x.t==='d'&&x.date.startsWith(mkey(y,m-2)))),big=ds.slice().sort((a,b)=>b.v-a.v)[0];
  h+=`<div class="card"><h2>Destaques</h2><div class="kv"><div><small>Média por dia</small><b>${fmt(tot/el)}</b></div><div><small>Face ao mês anterior</small><b>${ptot>0?(tot>=ptot?'+':'−')+pct(Math.abs(tot-ptot)/ptot*100):'–'}</b></div><div style="grid-column:1/-1"><small>Maior despesa</small><b>${big?esc(cat(big.cat).n)+(big.note?' · '+esc(big.note):'')+' — '+fmt(big.v):'–'}</b></div></div></div>`;
  $('res').innerHTML=h;
}

function renderSet(){
  $('cl').innerHTML=D.cats.map(c=>`<div class="cr"><span>${c.i} ${esc(c.n)}${c.t==='r'?' <small style="color:var(--mu)">(receita)</small>':''}</span>${c.t==='d'?`<input type="text" inputmode="decimal" data-b="${c.id}" value="${c.b||''}" placeholder="Orçamento">`:''}<button data-dc="${c.id}" aria-label="Apagar">🗑</button></div>`).join('');
}
function render(){
  const[y,m]=mon.split('-').map(Number);
  $('mlab').textContent=new Date(y,m-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  renderMov();renderRes();renderSet();
}
function show(t){
  tab=t;['mov','res','set'].forEach(k=>{$('t-'+k).classList.toggle('hide',k!==t);$('n-'+k).classList.toggle('on',k===t)});
  $('mnav').classList.toggle('hide',t==='set');$('fab').classList.toggle('hide',t==='set');scrollTo(0,0);
}

// folha de movimento
function fillCats(sel){const L=D.cats.filter(c=>c.t===tp);$('ct').innerHTML=L.map(c=>`<option value="${c.id}">${c.i} ${esc(c.n)}</option>`).join('');if(sel&&L.some(c=>c.id===sel))$('ct').value=sel}
function setTp(t,sel){tp=t;$('tpd').classList.toggle('on',t==='d');$('tpr').classList.toggle('on',t==='r');fillCats(sel)}
function openSheet(id){
  ed=id?D.movs.find(x=>x.id===id):null;
  $('sht').textContent=ed?'Editar movimento':'Novo movimento';
  $('v').value=ed?String(ed.v).replace('.',','):'';$('dt').value=ed?ed.date:today();$('nt').value=ed?ed.note:'';
  setTp(ed?ed.t:'d',ed?ed.cat:null);
  $('del').classList.toggle('hide',!ed);$('sh').classList.remove('hide');
  if(!ed)setTimeout(()=>$('v').focus(),50);
}
const closeSheet=()=>$('sh').classList.add('hide');
$('tpd').onclick=()=>setTp('d');$('tpr').onclick=()=>setTp('r');
$('fab').onclick=()=>openSheet();$('cx').onclick=closeSheet;
$('sh').addEventListener('click',e=>{if(e.target===$('sh'))closeSheet()});
$('sv').onclick=()=>{
  const v=parseFloat($('v').value.replace(',','.'));if(!(v>0)){$('v').focus();return}
  const o={t:tp,v:Math.round(v*100)/100,cat:$('ct').value,date:$('dt').value||today(),note:$('nt').value.trim()};
  if(ed)Object.assign(ed,o);else D.movs.push({id:Date.now(),...o});
  mon=o.date.slice(0,7);fc='';store();closeSheet();render();
};
$('del').onclick=()=>arm($('del'),()=>{D.movs=D.movs.filter(x=>x!==ed);store();closeSheet();render()});
$('lst').addEventListener('click',e=>{const it=e.target.closest('[data-id]');if(it)openSheet(+it.dataset.id)});
$('fc').onchange=e=>{fc=e.target.value;renderMov()};

// navegação
const shift=d=>{const[y,m]=mon.split('-').map(Number);mon=mkey(y,m-1+d);fc='';render()};
$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);
$('n-mov').onclick=()=>show('mov');$('n-res').onclick=()=>show('res');$('n-set').onclick=()=>show('set');

// definições
$('cl').addEventListener('change',e=>{const b=e.target.dataset.b;if(!b)return;const c=D.cats.find(c=>c.id===b);c.b=Math.max(0,parseFloat(e.target.value.replace(',','.'))||0);store();renderRes()});
$('cl').addEventListener('click',e=>{const b=e.target.closest('[data-dc]');if(b)arm(b,()=>{D.cats=D.cats.filter(c=>c.id!==b.dataset.dc);store();render()})});
$('nadd').onclick=()=>{const n=$('nn').value.trim();if(!n)return;D.cats.push({id:'c'+Date.now(),i:$('ni').value.trim()||'🏷️',n,t:$('nt2').value,b:0});$('nn').value='';$('ni').value='';store();render()};
$('cur').onchange=e=>{S.cur=e.target.value;store();render()};
$('th').onchange=e=>{S.th=e.target.value;store();applyTheme()};
$('clr').onclick=()=>arm($('clr'),()=>{D.movs=[];store();render()});

// exportar
function csv(L){let s='\ufeffData;Tipo;Categoria;Valor;Nota\n';L.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{s+=[x.date,x.t==='d'?'Despesa':'Receita',cat(x.cat).n,x.v.toFixed(2).replace('.',','),'"'+(x.note||'').replace(/"/g,'""')+'"'].join(';')+'\n'});return s}
async function exp(all){
  $('stat').textContent='';
  try{await DL.save({filename:all?'movimentos.csv':'movimentos-'+mon+'.csv',data:csv(all?D.movs:D.movs.filter(x=>x.date.startsWith(mon)))});$('stat').textContent='Ficheiro guardado ✓'}
  catch(e){$('stat').textContent=e&&e.code==='declined'?'':'Não foi possível exportar neste momento.'}
}
$('e1').onclick=()=>exp(false);$('e2').onclick=()=>exp(true);
$('exc').classList.add('hide');
(async()=>{try{DL=await claude.use('downloads')}catch(e){}if(DL)$('exc').classList.remove('hide')})();

$('cur').value=S.cur;$('th').value=S.th;applyTheme();render();
</script>

</body>
</html>
